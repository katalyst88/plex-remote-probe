name: plex-remote-stream

on:
  workflow_dispatch:
    inputs:
      rating_key:
        description: "Plex ratingKey to stream"
        required: true
        default: "450427"

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Stream a real movie from Plex over the public internet (HLS)
        env:
          PLEX_URL: ${{ secrets.PLEX_URL }}
          PLEX_TOKEN: ${{ secrets.PLEX_TOKEN }}
          RK: ${{ inputs.rating_key }}
        run: |
          set -uo pipefail
          CID="remote-probe-$RANDOM"
          A=(-H "X-Plex-Token: $PLEX_TOKEN" -H "X-Plex-Client-Identifier: $CID"
             -H "X-Plex-Product: Plex Web" -H "X-Plex-Platform: Chrome"
             -H "X-Plex-Session-Identifier: $CID")

          echo "remote client IP: $(curl -s --max-time 10 https://api.ipify.org)"
          echo

          B="$PLEX_URL/video/:/transcode/universal"
          Q="path=%2Flibrary%2Fmetadata%2F$RK&mediaIndex=0&partIndex=0&protocol=hls&directPlay=0&directStream=1&fastSeek=1&location=wan&maxVideoBitrate=12000&videoQuality=100&videoResolution=1920x1080&session=$CID&X-Plex-Client-Identifier=$CID"

          echo "=== 1. start an HLS transcode session (as a WAN client) ==="
          code=$(curl -s -o /tmp/master.m3u8 -w '%{http_code}' --max-time 60 "${A[@]}" "$B/start.m3u8?$Q")
          echo "  start.m3u8 -> HTTP $code"
          grep -E "BANDWIDTH|RESOLUTION" /tmp/master.m3u8 | head -1 | sed 's/^/  /'
          SUB=$(grep -v '^#' /tmp/master.m3u8 | head -1 | tr -d '\r')
          [ -z "$SUB" ] && { echo "  no sub-playlist; aborting"; exit 1; }
          case "$SUB" in http*) SUBURL="$SUB";; /*) SUBURL="$PLEX_URL$SUB";; *) SUBURL="$B/$SUB";; esac
          echo

          echo "=== 2. fetch the segment playlist (transcoder warming up) ==="
          for i in $(seq 1 12); do
            code=$(curl -s -o /tmp/idx.m3u8 -w '%{http_code}' --max-time 45 "${A[@]}" "$SUBURL")
            n=$(grep -c '\.ts' /tmp/idx.m3u8 || true)
            echo "  attempt $i: HTTP $code, $n segments listed"
            [ "$n" -gt 0 ] && break
            sleep 5
          done
          [ "$n" -eq 0 ] && { echo "  transcoder produced no segments"; exit 1; }
          echo

          echo "=== 3. DOWNLOAD REAL VIDEO SEGMENTS over the internet ==="
          total=0; secs=0; start=$(date +%s%N)
          for seg in $(grep '\.ts' /tmp/idx.m3u8 | head -8 | tr -d '\r'); do
            case "$seg" in http*) SU="$seg";; /*) SU="$PLEX_URL$seg";; *) SU="$(dirname "$SUBURL")/$seg";; esac
            sz=$(curl -s -o /tmp/seg.ts -w '%{size_download}' --max-time 60 "${A[@]}" "$SU")
            hdr=$(head -c 1 /tmp/seg.ts | xxd -p 2>/dev/null)
            total=$((total+sz)); secs=$((secs+4))
            echo "  segment: $(awk -v s="$sz" 'BEGIN{printf "%.2f", s/1048576}') MB  (starts 0x$hdr - 47 = valid MPEG-TS)"
          done
          end=$(date +%s%N)
          el=$(awk -v a="$start" -v b="$end" 'BEGIN{printf "%.2f", (b-a)/1000000000}')
          echo
          awk -v t="$total" -v e="$el" -v v="$secs" 'BEGIN{
            printf "  downloaded %.1f MB of video in %ss  =  %.2f Mbps sustained\n", t/1048576, e, (t*8)/(e*1000000)
            printf "  that is %.0f seconds of playback fetched in %ss (%.1fx realtime)\n", v, e, v/e
            printf "  VERDICT: %s\n", (t > 3000000 && v/e > 1.0) ? "PASS - remote streaming works, faster than realtime" : "FAIL"
          }'
          curl -s -o /dev/null "${A[@]}" "$B/stop?session=$CID" || true
